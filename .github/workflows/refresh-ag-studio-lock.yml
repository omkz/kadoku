name: Refresh feature branch pnpm lockfile
on:
  push:
    branches:
      - feature/ag-studio-analytics-v1
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ag-studio-analytics-v1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Resolve workspace lockfile
        working-directory: apps/web
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(web): update pnpm lockfile for AG Studio"
            git push origin HEAD:feature/ag-studio-analytics-v1
          fi
