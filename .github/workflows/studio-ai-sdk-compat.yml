name: Studio AI SDK compatibility
on:
  push:
    branches: [feature/ag-studio-analytics-v1]
  pull_request:
    paths:
      - 'apps/api/app/routers/studio_agent.py'
      - 'apps/api/app/studio_diagnostics.py'
      - 'apps/api/tests/test_studio_litellm_sdk.py'
      - 'apps/api/pyproject.toml'
jobs:
  sdk-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional LiteLLM SDK
        working-directory: apps/api
        run: python -m pip install -e '.[ai,test]'
      - name: Exercise SDK tools without provider network calls
        working-directory: apps/api
        run: pytest -q tests/test_studio_litellm_sdk.py
