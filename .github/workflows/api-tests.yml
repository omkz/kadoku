name: API tests
on:
  push:
  pull_request:
jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: apps/api
        run: python -m pip install -e '.[test]'
      - name: Run unit tests
        working-directory: apps/api
        run: pytest -q
