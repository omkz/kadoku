name: API tests
on:
  push:
  pull_request:
jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: apps/api
        run: python -m pip install -e '.[test]'
      - name: Run unit tests
        working-directory: apps/api
        run: pytest -q
      - name: Verify database migration upgrade and rollback
        working-directory: apps/api
        env:
          DATABASE_URL: sqlite:///./kadoku-migration-ci.db
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head
