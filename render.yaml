# Staging only: one Starter compute instance for Next.js + FastAPI.
# Blueprint adopts existing kadoku-api; other services and database remain unchanged.
services:
  - type: web
    name: kadoku-api
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    branch: staging
    rootDir: .
    buildCommand: bash scripts/render-unified-build.sh
    preDeployCommand: bash scripts/render-unified-migrate.sh
    startCommand: bash scripts/render-unified-start.sh
    autoDeployTrigger: off
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.16
      - key: NODE_VERSION
        value: 22.22.0
      - key: ENVIRONMENT
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: kadoku-db
          property: connectionString
      - key: AUTH_DATABASE_URL
        fromDatabase:
          name: kadoku-db
          property: connectionString
      - key: API_PROXY_TARGET
        value: http://127.0.0.1:8000
      # Startup sets FRONTEND_URL, BETTER_AUTH_URL and CORS_ORIGINS to
      # RENDER_EXTERNAL_URL, and GUEST_COOKIE_SECRET to GUEST_QUOTA_SECRET.
      # Copy the EXISTING kadoku-web Better Auth secret during initial Blueprint setup.
      # Never generate a new secret against the existing auth database.
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: GUEST_QUOTA_SECRET
        generateValue: true
      - key: PAYPAL_MODE
        value: sandbox

