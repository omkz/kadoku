
services:
  - type: web
    name: kadoku-api
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    rootDir: apps/api
    buildCommand: uv sync --frozen
    startCommand: uv run alembic upgrade head && uv run python -m app.seed && uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.16
      # Kadoku's current Render installation is a test-only staging environment.
      # Production must use separate services, DB and credentials later.
      - key: ENVIRONMENT
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: kadoku-db
          property: connectionString
      - key: BETTER_AUTH_URL
        fromService:
          type: web
          name: kadoku-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: FRONTEND_URL
        fromService:
          type: web
          name: kadoku-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: kadoku-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: GUEST_QUOTA_SECRET
        generateValue: true
      - key: PAYPAL_MODE
        value: sandbox

  - type: web
    name: kadoku-web
    runtime: node
    plan: free
    region: singapore
    rootDir: apps/web
    buildCommand: npx --yes pnpm@10.15.0 install --frozen-lockfile && npx --yes pnpm@10.15.0 build
    startCommand: node ./node_modules/next/dist/bin/next start --hostname 0.0.0.0 --port $PORT
    initialDeployHook: npx --yes auth@latest migrate --yes
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: AUTH_DATABASE_URL
        fromDatabase:
          name: kadoku-db
          property: connectionString
      - key: BETTER_AUTH_URL
        fromService:
          type: web
          name: kadoku-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: GUEST_COOKIE_SECRET
        fromService:
          type: web
          name: kadoku-api
          envVarKey: GUEST_QUOTA_SECRET
      - key: API_PROXY_TARGET
        fromService:
          type: web
          name: kadoku-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED
        value: "false"

databases:
  - name: kadoku-db
    plan: free
    region: singapore
    databaseName: kadoku
    user: kadoku
    ipAllowList: []
