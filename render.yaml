# Single Starter for both Next.js and FastAPI at the submitted hackathon URL.
# This Blueprint targets the EXISTING kadoku-web service; do not replicate it.
# kadoku-api and kadoku-db are deliberately excluded and must be managed separately.
services:
  - type: web
    name: kadoku-web
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    branch: staging
    rootDir: .
    buildCommand: bash scripts/render-unified-build.sh
    preDeployCommand: bash scripts/render-unified-migrate.sh
    startCommand: bash scripts/render-unified-start.sh
    autoDeployTrigger: off
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.16
      - key: NODE_VERSION
        value: 22.22.0
      - key: ENVIRONMENT
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: kadoku-db
          property: connectionString
      - key: AUTH_DATABASE_URL
        fromDatabase:
          name: kadoku-db
          property: connectionString
      - key: API_PROXY_TARGET
        value: http://127.0.0.1:8000
      # Startup sets FRONTEND_URL, BETTER_AUTH_URL and CORS_ORIGINS to
      # RENDER_EXTERNAL_URL, and GUEST_COOKIE_SECRET to GUEST_QUOTA_SECRET.
      # Preserve the existing web service Better Auth secret.
      - key: BETTER_AUTH_SECRET
        sync: false
      # Copy the existing kadoku-api value manually, via Render Environment.
      - key: GUEST_QUOTA_SECRET
        sync: false
      # AI and PayPal credentials must be copied from the old API service
      # through Render Environment; never put secrets in source control.
      - key: AI_MODEL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_MODE
        value: sandbox

