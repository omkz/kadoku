# Preview deployment only. Render Free Postgres expires after 30 days with no backup.
# Connect GitHub in Render > New > Blueprint and select this repository.
# For a real production store use paid, persistent services and validated suppliers.
services:
  - type: web
    name: kadoku-api
    runtime: python
    plan: free
    region: singapore
    rootDir: apps/api
    buildCommand: uv sync --frozen
    # Free web services do not support preDeployCommand. Migrate before serving.
    startCommand: uv run alembic upgrade head && uv run python -m app.seed && uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.16
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kadoku-db
          property: connectionString
      - key: BETTER_AUTH_URL
        fromService:
          name: kadoku-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: FRONTEND_URL
        fromService:
          name: kadoku-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CORS_ORIGINS
        fromService:
          name: kadoku-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: GUEST_QUOTA_SECRET
        generateValue: true
      - key: PAYPAL_MODE
        value: sandbox
      - key: STUDIO_AGENT_ENABLED
        value: "false"

  - type: web
    name: kadoku-web
    runtime: node
    plan: free
    region: singapore
    rootDir: apps/web
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm build
    startCommand: corepack pnpm exec next start --hostname 0.0.0.0 --port $PORT
    # Better Auth tables are not owned by Alembic; initialize once on first deploy.
    initialDeployHook: corepack pnpm dlx auth@1.7.18 migrate --yes
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: AUTH_DATABASE_URL
        fromDatabase:
          name: kadoku-db
          property: connectionString
      - key: BETTER_AUTH_URL
        fromService:
          name: kadoku-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: GUEST_COOKIE_SECRET
        fromService:
          name: kadoku-api
          type: web
          envVarKey: GUEST_QUOTA_SECRET
      # Free Render web services cannot receive inbound private-network traffic.
      # Proxy through the API's public HTTPS URL, not its private host.
      - key: API_PROXY_TARGET
        fromService:
          name: kadoku-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED
        value: "false"

databases:
  - name: kadoku-db
    plan: free
    region: singapore
    databaseName: kadoku
    user: kadoku
    # The database should not be accessible directly from the public internet.
    ipAllowList: []
